name: Skill execution evidence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional test dependency
        run: python -m pip install --disable-pip-version-check z3-solver
      - name: Execute every skill self-test
        run: python skill-creator/scripts/evidence.py --root . --output artifacts/skill-evidence
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Capture report screenshot
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node skill-creator/scripts/capture_report.mjs artifacts/skill-evidence/report.html artifacts/skill-evidence/screenshots/report.png
      - name: Add evidence summary
        if: always()
        run: |
          if [ -f artifacts/skill-evidence/verification.md ]; then
            cat artifacts/skill-evidence/verification.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Evidence runner did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-execution-evidence
          path: artifacts/skill-evidence/
          if-no-files-found: warn
          retention-days: 90
